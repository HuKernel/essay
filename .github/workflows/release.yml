name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      # softprops/action-gh-release 需要 write 权限创建 Release 并上传资产
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer & main
        run: npm run build

      # --publish never：CI + tag 场景下 electron-builder 会默认尝试自动发布到 GitHub，
      # 缺少 GH_TOKEN 直接报错退出；发布交给下方 Upload release assets 步骤
      - name: Package (NSIS + portable)
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee builder.log || {
            grep -aE "⨯|[Ee]rror" builder.log | head -5 | sed 's/^/::error::/' || true
            exit 1
          }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
